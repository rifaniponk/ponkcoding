<svg xmlns="http://www.w3.org/2000/svg" width="900" height="1200" viewBox="0 0 900 1200" role="img" aria-labelledby="title desc">
  <title id="title">LM360 custom display driver architecture</title>
  <desc id="desc">A simple vertical architecture diagram showing Windows sensors flowing through the Python display loop, renderer, and USB transport to the DeepCool LM360 LCD.</desc>
  <defs>
    <pattern id="grid" width="36" height="36" patternUnits="userSpaceOnUse">
      <path d="M36 0H0V36" fill="none" stroke="#1e293b" stroke-width="1"/>
    </pattern>
    <linearGradient id="background" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0b1220"/>
      <stop offset="1" stop-color="#020617"/>
    </linearGradient>
    <linearGradient id="screen" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#12344a"/>
      <stop offset="1" stop-color="#172033"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#000" flood-opacity=".35"/>
    </filter>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M0 0L12 6L0 12Z" fill="#22d3ee"/>
    </marker>
    <style>
      .title{font:700 34px 'JetBrains Mono',monospace;fill:#f8fafc;letter-spacing:.4px}
      .subtitle{font:400 16px 'JetBrains Mono',monospace;fill:#94a3b8}
      .eyebrow{font:700 15px 'JetBrains Mono',monospace;fill:#64748b;letter-spacing:2px}
      .name{font:700 27px 'JetBrains Mono',monospace;fill:#f8fafc}
      .label{font:400 17px 'JetBrains Mono',monospace;fill:#cbd5e1}
      .note{font:400 14px 'JetBrains Mono',monospace;fill:#94a3b8}
      .box{rx:18;stroke-width:3}
    </style>
  </defs>

  <rect width="900" height="1200" fill="url(#background)"/>
  <rect width="900" height="1200" fill="url(#grid)" opacity=".55"/>
  <rect x="34" y="34" width="832" height="1132" rx="24" fill="none" stroke="#334155" stroke-width="2"/>

  <circle cx="82" cy="92" r="8" fill="#34d399"/>
  <text x="112" y="92" class="title" dominant-baseline="middle">LM360 CUSTOM DRIVER</text>
  <text x="82" y="132" class="subtitle">A small path from system telemetry to the pump-cap LCD</text>
  <line x1="82" y1="174" x2="818" y2="174" stroke="#334155" stroke-width="2"/>

  <!-- flow arrows behind the boxes -->
  <line x1="450" y1="342" x2="450" y2="388" stroke="#22d3ee" stroke-width="4" marker-end="url(#arrow)"/>
  <line x1="450" y1="542" x2="450" y2="588" stroke="#22d3ee" stroke-width="4" marker-end="url(#arrow)"/>
  <line x1="450" y1="742" x2="450" y2="788" stroke="#22d3ee" stroke-width="4" marker-end="url(#arrow)"/>
  <line x1="450" y1="942" x2="450" y2="988" stroke="#22d3ee" stroke-width="4" marker-end="url(#arrow)"/>

  <text x="82" y="224" class="eyebrow">DATA FLOW</text>

  <rect x="110" y="250" width="680" height="92" class="box" fill="#0f172a" stroke="#34d399" filter="url(#shadow)"/>
  <circle cx="158" cy="296" r="18" fill="#34d399" fill-opacity=".18" stroke="#34d399" stroke-width="2"/>
  <text x="198" y="288" class="name">Windows sensors</text>
  <text x="198" y="316" class="label">CPU · GPU · RAM · SSD telemetry</text>

  <rect x="110" y="450" width="680" height="92" class="box" fill="#0f172a" stroke="#fbbf24" filter="url(#shadow)"/>
  <circle cx="158" cy="496" r="18" fill="#fbbf24" fill-opacity=".18" stroke="#fbbf24" stroke-width="2"/>
  <text x="198" y="488" class="name">Python display loop</text>
  <text x="198" y="516" class="label">Read · render · send · reconnect</text>

  <rect x="110" y="650" width="680" height="92" class="box" fill="#0f172a" stroke="#a78bfa" filter="url(#shadow)"/>
  <circle cx="158" cy="696" r="18" fill="#a78bfa" fill-opacity=".18" stroke="#a78bfa" stroke-width="2"/>
  <text x="198" y="688" class="name">Pillow renderer</text>
  <text x="198" y="716" class="label">Draw gauges and bars · convert to RGB565</text>

  <rect x="110" y="850" width="680" height="92" class="box" fill="#0f172a" stroke="#22d3ee" filter="url(#shadow)"/>
  <circle cx="158" cy="896" r="18" fill="#22d3ee" fill-opacity=".18" stroke="#22d3ee" stroke-width="2"/>
  <text x="198" y="888" class="name">USB transport</text>
  <text x="198" y="916" class="label">PyUSB + libusb · frame transfer</text>

  <rect x="110" y="1050" width="680" height="92" class="box" fill="url(#screen)" stroke="#fb7185" filter="url(#shadow)"/>
  <rect x="150" y="1072" width="48" height="48" rx="6" fill="#07111c" stroke="#22d3ee" stroke-width="2"/>
  <circle cx="174" cy="1090" r="9" fill="none" stroke="#34d399" stroke-width="3"/>
  <rect x="162" y="1104" width="24" height="4" rx="2" fill="#fbbf24"/>
  <text x="230" y="1088" class="name">DeepCool LM360 LCD</text>
  <text x="230" y="1116" class="label">320 × 240 pump-cap display</text>

  <text x="450" y="1174" class="note" text-anchor="middle">No vendor dashboard required</text>
</svg>
